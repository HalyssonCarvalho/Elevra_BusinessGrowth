<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth OS — Elevra Business Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1E3B;
  --navy-2:#132A4E;
  --navy-soft:#3A5578;
  --ink:#0F172A;
  --ink-muted:#64748B;
  --line:#E6E9EE;
  --bg:#FAFBFC;
  --card:#FFFFFF;
  --green:#0F9D58;
  --green-bg:#E9F7EF;
  --yellow:#B7791F;
  --yellow-bg:#FBF3E3;
  --red:#C0392B;
  --red-bg:#FCEBE9;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;min-height:100vh;}

/* Sidebar */
#sidebar{
  width:248px;
  flex-shrink:0;
  background:var(--navy);
  color:#EAF0F8;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  overflow-y:auto;
}
#sidebar .brand{
  padding:26px 22px 18px 22px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
#sidebar .brand .name{font-weight:700;font-size:15px;letter-spacing:0.2px;}
#sidebar .brand .tag{font-size:11px;color:#9FB3CC;margin-top:3px;letter-spacing:0.4px;text-transform:uppercase;}
.navgroup{padding:14px 10px;}
.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#7F93AD;padding:10px 12px 6px 12px;}
.navitem{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:1px 0;
  border-radius:9px;
  font-size:13.5px;
  color:#CBD8EA;
  cursor:pointer;
  transition:background .12s ease, color .12s ease;
  user-select:none;
}
.navitem:hover{background:rgba(255,255,255,0.06);color:#fff;}
.navitem.active{background:#EAF0F8;color:var(--navy);font-weight:600;}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0;}
.navitem.active .dot{opacity:1;}
.navnum{width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;opacity:.6;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.navitem.active .navnum{opacity:1;background:var(--navy);color:#EAF0F8;border-color:var(--navy);}
.navitem .navnum.done{opacity:1;background:#7FE0A8;border-color:#7FE0A8;color:var(--navy);}

/* Main */
#main{margin-left:248px;flex:1;min-width:0;padding:32px 40px 80px 40px;max-width:1180px;}
.page-head{margin-bottom:26px;}
.page-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);font-weight:600;}
.page-title{font-size:26px;font-weight:700;margin:4px 0 6px 0;letter-spacing:-0.02em;}
.page-sub{font-size:14px;color:var(--ink-muted);max-width:720px;line-height:1.5;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
.card + .card{margin-top:16px;}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}

.section-title{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink);margin:0 0 4px 0;}
.section-help{font-size:12.5px;color:var(--ink-muted);margin:0 0 16px 0;line-height:1.5;}

/* Explain box: what/how/why/decisions */
.explain{
  background:#F3F6FA;
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:20px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
@media (max-width:900px){.explain{grid-template-columns:1fr 1fr;}}
.explain .item .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy-soft);font-weight:700;margin-bottom:4px;}
.explain .item .b{font-size:12.5px;color:var(--ink);line-height:1.45;}

label.field-label{display:block;font-size:12px;color:var(--ink-muted);margin-bottom:5px;font-weight:500;}
input[type=text], input[type=number], input[type=date], textarea, select{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 11px;
  font-size:13.5px;
  font-family:inherit;
  color:var(--ink);
  background:#fff;
  transition:border-color .12s ease;
}
input:focus, textarea:focus, select:focus{outline:none;border-color:var(--navy-soft);}
textarea{resize:vertical;min-height:80px;}
.field{margin-bottom:14px;}

button.btn{
  background:var(--navy);
  color:#fff;
  border:none;
  border-radius:9px;
  padding:9px 16px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:background .12s ease, transform .08s ease;
}
button.btn:hover{background:var(--navy-2);}
button.btn:active{transform:scale(.98);}
button.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);}
button.btn.secondary:hover{background:#F3F6FA;}
button.btn.ghost{background:transparent;color:var(--ink-muted);border:1px solid transparent;padding:6px 10px;}
button.btn.ghost:hover{color:var(--red);}
button.btn:disabled{opacity:.5;cursor:default;}
button.btn.small{padding:6px 12px;font-size:12px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;}
td{padding:9px 10px;border-bottom:1px solid #F0F2F5;vertical-align:top;}
tr:last-child td{border-bottom:none;}
td input, td select{padding:6px 8px;font-size:13px;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.yellow{background:var(--yellow-bg);color:var(--yellow);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge .d{width:6px;height:6px;border-radius:50%;background:currentColor;}

.kpi-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;}
.kpi-card.missing{border-color:#F3C6C2;background:#FFFBFA;}
.data-alert{border-radius:12px;padding:14px 18px;margin-bottom:20px;font-size:13px;line-height:1.55;}
.data-alert.warn{background:var(--red-bg);border:1px solid #F3C6C2;color:var(--ink);}
.data-alert.warn b{color:var(--red);}
.kpi-card .label{font-size:11px;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.kpi-card .value{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-0.01em;}
.kpi-card .foot{font-size:11.5px;margin-top:6px;color:var(--ink-muted);}

.ring-wrap{display:flex;align-items:center;gap:26px;}
.ring{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.ring .inner{width:112px;height:112px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .inner .n{font-size:24px;font-weight:800;color:var(--navy);}
.ring .inner .l{font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;}

.funnel-row{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:14px;margin-bottom:10px;}
.funnel-row .stage-name{font-size:12.5px;font-weight:600;color:var(--ink);}
.funnel-bar-track{background:#F0F2F5;border-radius:7px;height:26px;overflow:hidden;}
.funnel-bar-fill{background:linear-gradient(90deg,var(--navy),var(--navy-soft));height:100%;border-radius:7px;display:flex;align-items:center;padding-left:10px;}
.funnel-bar-fill span{color:#fff;font-size:11.5px;font-weight:700;}
.funnel-conv{font-size:11.5px;color:var(--ink-muted);text-align:right;}

.cadence-row{display:grid;grid-template-columns:150px repeat(4,1fr);align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0F2F5;}
.cadence-row:last-child{border-bottom:none;}
.cadence-cell{background:#F7F9FC;border-radius:8px;padding:8px 10px;text-align:center;}
.cadence-n{display:block;font-size:16px;font-weight:700;color:var(--navy);}
.cadence-l{display:block;font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;margin-top:1px;}
@media (max-width:860px){.cadence-row{grid-template-columns:1fr 1fr;row-gap:6px;}.cadence-row .stage-name{grid-column:1/-1;}}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#F0F2F5;color:var(--ink-muted);font-weight:700;font-size:12px;}
.rank-badge.gold{background:#FCEFC7;color:#946200;}
.rank-badge.silver{background:#E8EAED;color:#5A5F66;}
.rank-badge.bronze{background:#F3DFC9;color:#8A5A2B;}
.day-strip{display:flex;gap:8px;flex-wrap:wrap;}
.day-chip{flex:1;min-width:60px;border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;background:#fff;transition:border-color .12s ease;}
.day-chip:hover{border-color:var(--navy-soft);}
.day-chip.selected{border-color:var(--navy);box-shadow:0 0 0 2px #EAF0F8;}
.day-chip.logged{background:var(--green-bg);border-color:#CDEBD9;}
.day-chip-label{font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;font-weight:700;}
.day-chip-mark{font-size:15px;font-weight:700;color:var(--ink-muted);margin-top:3px;}
.day-chip.logged .day-chip-mark{color:var(--green);}

.pill-nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.pill-nav .p{padding:6px 13px;border-radius:100px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink-muted);cursor:pointer;}
.pill-nav .p.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.empty{border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--ink-muted);font-size:13px;}
.empty b{color:var(--ink);}

.ai-block{border-left:3px solid var(--navy);background:#F7F9FC;border-radius:0 10px 10px 0;padding:16px 18px;margin-bottom:14px;}
.ai-block h4{margin:0 0 8px 0;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);}
.ai-block .txt{font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
.loading-dots::after{content:'';animation:dots 1.2s steps(4,end) infinite;}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%{content:'...'}80%,100%{content:''}}

.priority-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:44px 1fr 130px;gap:16px;align-items:start;}
.priority-card .num{width:36px;height:36px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
.priority-card .meta{font-size:11.5px;color:var(--ink-muted);margin-top:4px;line-height:1.5;}
.priority-card .stat{text-align:right;}
.priority-card .stat .impact{font-size:17px;font-weight:700;color:var(--green);}
.priority-card .stat .impact.neutral{color:var(--navy);}

.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;background:#F0F2F5;color:var(--ink-muted);font-weight:600;margin-right:6px;}
.savebar{position:fixed;bottom:18px;right:38px;left:auto;max-width:calc(100% - 56px);background:var(--navy);color:#fff;font-size:12px;padding:8px 16px;border-radius:100px;opacity:0;transition:opacity .25s ease;pointer-events:none;box-shadow:0 6px 18px rgba(11,30,59,.25);}
.savebar.show{opacity:1;}
.savebar.error{background:var(--red);border-radius:12px;}

.hr{height:1px;background:var(--line);margin:18px 0;border:none;}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.muted{color:var(--ink-muted);}
.small{font-size:12px;}
a.linklike{color:var(--navy);text-decoration:underline;cursor:pointer;font-size:12.5px;}
.i18n-term{border-bottom:1px dotted var(--ink-muted);cursor:help;}
.i18n-term:hover{border-bottom-color:var(--navy);}

/* Guided sequence */
.guide-bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:20px;}
.guide-bar-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:10px;}
.guide-dots{display:flex;align-items:center;overflow-x:auto;padding-bottom:2px;}
.gstep{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;cursor:pointer;border:2px solid var(--line);color:var(--ink-muted);background:#fff;}
.gstep.done{background:var(--green);border-color:var(--green);color:#fff;}
.gstep.cur{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 4px #EAF0F8;}
.gstep.todo:hover{border-color:var(--navy-soft);color:var(--navy-soft);}
.gline{flex:1;height:2px;background:var(--line);margin:0 2px;}

.next-callout{margin-top:20px;border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.next-callout.done{background:var(--green-bg);border:1px solid #CDEBD9;}
.next-callout.done b{color:var(--green);}
.next-callout.pending{background:#F3F6FA;border:1px solid var(--line);}
.next-callout div{font-size:13px;line-height:1.5;color:var(--ink);}
.workspace-switch{display:flex;gap:6px;padding:14px 22px 4px 22px;align-items:center;}
.workspace-switch select{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:#EAF0F8;border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;}
.workspace-switch select option{color:#0F172A;}
.workspace-switch button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:#EAF0F8;border-radius:8px;width:28px;height:28px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0;}
.workspace-switch button:hover{background:rgba(255,255,255,0.16);}
.sidebar-key-btn{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.16);color:#EAF0F8;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;}
.sidebar-key-btn:hover{background:rgba(255,255,255,0.14);}
.sidebar-privacy-note{font-size:10.5px;color:#9FB3CC;line-height:1.5;margin-top:8px;}
.sidebar-progress{padding:0 22px 16px 22px;}
.sidebar-progress .bartrack{height:5px;border-radius:3px;background:rgba(255,255,255,0.12);overflow:hidden;margin-top:6px;}
.sidebar-progress .barfill{height:100%;background:#7FE0A8;border-radius:3px;}
.sidebar-progress .lbl{font-size:10.5px;color:#9FB3CC;}
.navitem .check{margin-left:auto;color:#7FE0A8;font-size:12px;font-weight:700;}

/* Mobile shell: sidebar becomes a collapsible top bar instead of a fixed 248px column */
.mobile-toggle{display:none;}
@media (max-width: 860px){
  #sidebar{
    position:fixed; top:0; left:0; right:0; bottom:auto;
    width:100%; max-height:100vh; overflow-y:auto; z-index:60;
  }
  #sidebar .brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;}
  #sidebar .brand .tag{display:none;}
  #sidebar:not(.mobile-open) .workspace-switch,
  #sidebar:not(.mobile-open) .sidebar-progress,
  #sidebar:not(.mobile-open) .navgroup{display:none;}
  .mobile-toggle{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:8px;flex-shrink:0;
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);
    color:#EAF0F8;font-size:16px;cursor:pointer;
  }
  #main{margin-left:0;margin-top:58px;padding:20px 16px 80px 16px;max-width:100%;}
  .ring-wrap{flex-wrap:wrap;}
  .funnel-row{grid-template-columns:1fr;gap:4px;}
  .funnel-row .stage-name{font-size:12px;}
  .priority-card{grid-template-columns:36px 1fr;}
  .priority-card .stat{grid-column:1 / -1;text-align:left;margin-top:8px;}
  .explain{grid-template-columns:1fr;}
  button.btn{min-height:40px;}
  button.btn.small{min-height:36px;}
  .navitem{min-height:46px;padding-top:10px;padding-bottom:10px;}
  .mobile-toggle{width:40px;height:40px;font-size:18px;}
  select, input[type=text], input[type=number], input[type=date]{min-height:40px;}
  .gstep{width:22px;height:22px;font-size:10px;flex-shrink:0;}
  .gline{min-width:8px;}
  .savebar{right:16px;left:16px;text-align:center;}
}

</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<div class="savebar" id="savebar">Salvo</div>
<script>
/* ============================= STANDALONE-MODE STORAGE POLYFILL ============================= */
// Inside Claude's artifact environment, window.storage is provided natively (cross-device,
// tied to the person's Claude account). Outside of it — e.g. hosted on GitHub Pages — that
// API doesn't exist, so we polyfill the exact same interface backed by localStorage. Every
// other line of code in this file is unaffected: it just calls window.storage as usual.
const STANDALONE_MODE = !window.storage;
if(STANDALONE_MODE){
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem("gos:" + key);
      if(raw === null) throw new Error("not found");
      return {key, value: raw, shared};
    },
    async set(key, value, shared){
      try{ localStorage.setItem("gos:" + key, value); return {key, value, shared}; }
      catch(e){ return null; }
    },
    async delete(key, shared){
      localStorage.removeItem("gos:" + key);
      return {key, deleted:true, shared};
    },
    async list(prefix, shared){
      const keys = Object.keys(localStorage)
        .filter(k=>k.startsWith("gos:"))
        .map(k=>k.slice(4))
        .filter(k=>!prefix||k.startsWith(prefix));
      return {keys, prefix, shared};
    },
  };
}

/* ============================= CONSTANTS ============================= */

const NAV = [
  {group:"Operar", items:[
    {id:"dashboard", label:"Executive Dashboard"},
    {id:"ai-analysis", label:"AI Growth Analysis"},
    {id:"reverse-eng", label:"Reverse Engineering"},
  ]},
  {group:"Performance", items:[
    {id:"loan-officers", label:"Loan Officers"},
    {id:"realtor-partners", label:"Realtor Partners"},
    {id:"channels", label:"Acquisition Channels"},
  ]},
  {group:"Executar", items:[
    {id:"scorecard", label:"Weekly Scorecard"},
    {id:"action-plan", label:"Growth Action Plan"},
    {id:"weekly-coach", label:"AI Weekly Coach"},
    {id:"meetings", label:"Meeting Assistant"},
    {id:"risks", label:"Risk Register"},
  ]},
  {group:"Aprender", items:[
    {id:"experiments", label:"Experiments"},
    {id:"sop", label:"SOP Library"},
    {id:"knowledge", label:"Knowledge Base"},
  ]},
  {group:"Entregável", items:[
    {id:"blueprint", label:"Blueprint 30/60/90"},
  ]},
];

// Funnel stage definitions: key, label, and the rate-key that converts FROM previous stage TO this stage
const STAGES = [
  {key:"leads", label:"Leads"},
  {key:"qualifiedLeads", label:"Qualified Leads", rateKey:"leadToQualified", rateLabel:"Lead → Qualified"},
  {key:"appointments", label:"Appointments", rateKey:"qualifiedToAppt", rateLabel:"Qualified → Appointment"},
  {key:"applications", label:"Applications", rateKey:"apptToApp", rateLabel:"Appointment → Application"},
  {key:"preApprovals", label:"Pre Approvals", rateKey:"appToPreApproval", rateLabel:"Application → Pre-Approval"},
  {key:"clearToClose", label:"Clear To Close", rateKey:"preApprovalToCTC", rateLabel:"Pre-Approval → CTC"},
  {key:"loans", label:"Loans", rateKey:"ctcToLoan", rateLabel:"CTC → Loan"},
];

const DEFAULT_RATES = {
  leadToQualified: 40,
  qualifiedToAppt: 50,
  apptToApp: 60,
  appToPreApproval: 70,
  preApprovalToCTC: 85,
  ctcToLoan: 95,
};

const EXTRA_KPI_FIELDS = [
  {key:"revenue", label:"Revenue", prefix:"$"},
  {key:"marketingSpend", label:"Marketing Spend", prefix:"$"},
  {key:"cac", label:"CAC", prefix:"$"},
  {key:"responseTime", label:"Response Time (min)"},
  {key:"loanOfficers", label:"Loan Officers"},
  {key:"realtorPartners", label:"Realtor Partners"},
];

const MODEL = "claude-sonnet-4-6";

/* ============================= PT-BR TRANSLATION TOOLTIPS ============================= */
// Every English term in the UI (funnel stages, KPI fields, module names) gets a hoverable
// "balãozinho" (dotted underline) showing its Portuguese meaning — text stays in English
// (matching the original spec / mortgage industry vocabulary), translation is one hover away.

const PT_TRANSLATIONS = {

// Maps normalized (lowercase, no accents/spaces) header text -> internal field key

  "semana":"weekLabel", "week":"weekLabel", "weeklabel":"weekLabel", "label":"weekLabel", "rotulo":"weekLabel", "periodo":"weekLabel",
  "leads":"leads",
  "qualifiedleads":"qualifiedLeads", "leadsqualificados":"qualifiedLeads", "qualificados":"qualifiedLeads",
  "appointments":"appointments", "agendamentos":"appointments", "reunioes":"appointments",
  "applications":"applications", "aplicacoes":"applications", "aplicacao":"applications",
  "preapprovals":"preApprovals", "preaprovacoes":"preApprovals", "preaprovacao":"preApprovals",
  "cleartoclose":"clearToClose", "ctc":"clearToClose",
  "loans":"loans", "emprestimos":"loans", "fechamentos":"loans",
  "revenue":"revenue", "receita":"revenue",
  "marketingspend":"marketingSpend", "gastodemarketing":"marketingSpend", "investimentomarketing":"marketingSpend",
  "cac":"cac",
  "responsetime":"responseTime", "tempoderesposta":"responseTime", "temporesposta":"responseTime",

};

// The expected order of the funnel — used to catch data that violates basic funnel logic
// (a downstream stage can never have more volume than the stage that feeds it).
const FUNNEL_ORDER = ["leads","qualifiedLeads","appointments","applications","preApprovals","clearToClose","loans"];

function normalizeHeader(h){
  return (h||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}

function detectDelimiter(headerLine){
  const counts = {
    ",": (headerLine.match(/,/g)||[]).length,
    ";": (headerLine.match(/;/g)||[]).length,
    "\t": (headerLine.match(/\t/g)||[]).length,
  };
  let best = ",", bestCount = counts[","];
  [";","\t"].forEach(d=>{ if(counts[d] > bestCount){ best = d; bestCount = counts[d]; } });
  return best;
}

function parseCSV(text){
  // strip BOM
  text = text.replace(/^\uFEFF/, "");
  const lines = text.split(/\r\n|\r|\n/).filter(l=>l.trim().length>0);
  if(!lines.length) return {rawHeaders: [], rows: []};
  const delimiter = detectDelimiter(lines[0]);

  function splitLine(line){
    const out = [];
    let cur = "";
    let inQuotes = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c === '"'){
        if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if(c === delimiter && !inQuotes){
        out.push(cur); cur = "";
      } else {
        cur += c;
      }
    }
    out.push(cur);
    return out.map(s=>s.trim());
  }

  const rawHeaders = splitLine(lines[0]);
  const headers = rawHeaders.map(normalizeHeader);
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const cells = splitLine(lines[i]);
    const row = {};
    headers.forEach((h,idx)=>{ row[h] = cells[idx]; });
    rows.push(row);
  }
  return {rawHeaders, headers, rows};
}

// Auto-detects whether a number uses Brazilian/European formatting (1.234,56) or
// American formatting (1,234.56) — or plain thousands grouping with no decimals at all —
// instead of assuming one locale and silently mangling the other.
function parseNumberLoose(raw){
  if(raw === undefined || raw === null) return {value:null, raw};
  let s = raw.toString().trim();
  if(s === "") return {value:null, raw};
  // strip currency symbols, spaces, letters — keep only digits, comma, dot, minus
  s = s.replace(/[^0-9,.\-]/g, "");
  if(s === "" || s === "-"){
    return {value:null, raw};
  }

  const hasComma = s.includes(",");
  const hasDot = s.includes(".");

  if(hasComma && hasDot){
    const lastComma = s.lastIndexOf(",");
    const lastDot = s.lastIndexOf(".");
    if(lastComma > lastDot){
      s = s.replace(/\./g, "").replace(",", "."); // BR/EU: dot=thousands, comma=decimal
    } else {
      s = s.replace(/,/g, ""); // US: comma=thousands, dot=decimal
    }
  } else if(hasComma){
    const parts = s.split(",");
    const lastPart = parts[parts.length-1];
    s = (lastPart.length === 3) ? parts.join("") : parts.slice(0,-1).join("") + "." + lastPart;
  } else if(hasDot){
    const parts = s.split(".");
    const lastPart = parts[parts.length-1];
    if(parts.length > 1 && lastPart.length === 3) s = parts.join("");
    // else: single decimal point, leave as-is
  }

  const n = parseFloat(s);
  return {value: isNaN(n) ? null : n, raw};
}

function csvRowsToEntries(parsed){
  const {rawHeaders, headers, rows} = parsed;
  const entries = [];
  const issues = {unrecognizedColumns: [], unparseableCells: [], funnelViolations: [], negativeValues: []};

  // Report any column header we genuinely don't recognize, so the person can fix the spreadsheet
  // instead of silently losing a whole column of data.
  (rawHeaders||[]).forEach((raw, idx)=>{
    const norm = headers[idx];
    if(norm && !CSV_HEADER_MAP[norm] && !issues.unrecognizedColumns.includes(raw)){
      issues.unrecognizedColumns.push(raw);
    }
  });

  rows.forEach((row, i)=>{
    const entry = {id: uid()};
    let hasAnyData = false;
    const rowLabel = row["semana"] || row["week"] || row["weeklabel"] || row["label"] || row["rotulo"] || row["periodo"] || `linha ${i+2}`;

    Object.keys(row).forEach(h=>{
      const fieldKey = CSV_HEADER_MAP[h];
      if(!fieldKey) return;
      if(fieldKey === "weekLabel"){ entry.weekLabel = row[h] || ""; return; }
      const raw = row[h];
      const {value} = parseNumberLoose(raw);
      entry[fieldKey] = value;
      if(value !== null){
        hasAnyData = true;
        if(value < 0){
          issues.negativeValues.push(`${rowLabel}: ${fieldKey} = ${value}`);
        }
      } else if(raw !== undefined && raw !== null && raw.toString().trim() !== ""){
        // there WAS text in the cell, but we couldn't turn it into a number
        issues.unparseableCells.push(`${rowLabel}: campo "${fieldKey}" tinha "${raw}" (não reconhecido como número)`);
      }
    });

    if(!entry.weekLabel) entry.weekLabel = "Semana importada " + (i+1);

    // Funnel logic check: a downstream stage can't have more volume than the stage feeding it.
    for(let k=1;k<FUNNEL_ORDER.length;k++){
      const prevKey = FUNNEL_ORDER[k-1], curKey = FUNNEL_ORDER[k];
      const prevVal = entry[prevKey], curVal = entry[curKey];
      if(prevVal!==null && prevVal!==undefined && curVal!==null && curVal!==undefined && curVal > prevVal){
        issues.funnelViolations.push(`${entry.weekLabel}: ${curKey} (${curVal}) maior que ${prevKey} (${prevVal})`);
      }
    }

    if(hasAnyData) entries.push(entry);
  });

  return {entries, issues};
}


// Builds the post-import report: what came in clean, plus any columns, cells, or funnel
// logic that look broken — so problems surface instead of silently becoming wrong numbers.
function buildImportSummaryHtml(added, updated, issues){
  const parts = [];
  parts.push(`<div class="ai-block"><h4>Importação concluída</h4><div class="txt">${added} semana(s) nova(s) adicionada(s), ${updated} atualizada(s) — total de ${state.entries.length} semanas no histórico. O Dashboard, o funil, a tendência e os indicadores já foram recalculados.</div></div>`);

  if(issues.unrecognizedColumns.length){
    parts.push(`<div class="data-alert warn" style="margin-top:10px;"><div><b>⚠ Colunas não reconhecidas (ignoradas):</b> ${issues.unrecognizedColumns.map(esc).join(", ")}. Renomeie essas colunas para bater com o modelo se elas deveriam ter sido importadas.</div></div>`);
  }
  if(issues.unparseableCells.length){
    const shown = issues.unparseableCells.slice(0,8);
    parts.push(`<div class="data-alert warn" style="margin-top:10px;"><div><b>⚠ ${issues.unparseableCells.length} célula(s) com valor não reconhecido como número:</b><br>${shown.map(esc).join("<br>")}${issues.unparseableCells.length>shown.length?`<br>… e mais ${issues.unparseableCells.length-shown.length}.`:''}</div></div>`);
  }
  if(issues.negativeValues.length){
    const shown = issues.negativeValues.slice(0,8);
    parts.push(`<div class="data-alert warn" style="margin-top:10px;"><div><b>⚠ ${issues.negativeValues.length} valor(es) negativo(s) — provavelmente erro de digitação:</b><br>${shown.map(esc).join("<br>")}${issues.negativeValues.length>shown.length?`<br>… e mais ${issues.negativeValues.length-shown.length}.`:''}</div></div>`);
  }
  if(issues.funnelViolations.length){
    const shown = issues.funnelViolations.slice(0,8);
    parts.push(`<div class="data-alert warn" style="margin-top:10px;"><div><b>⚠ ${issues.funnelViolations.length} semana(s) com funil ilógico</b> (uma etapa mais avançada tem mais volume que a etapa anterior — geralmente é coluna trocada ou erro de digitação):<br>${shown.map(esc).join("<br>")}${issues.funnelViolations.length>shown.length?`<br>… e mais ${issues.funnelViolations.length-shown.length}.`:''}</div></div>`);
  }
  return parts.join("");
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Restores a previously exported backup into the CURRENT active company (overwrites it).
async function importBackupJSON(text){
  let parsed;
  try{ parsed = JSON.parse(text); }
  catch(e){ throw new Error("Arquivo não é um JSON válido."); }
  if(!parsed || parsed._type !== "growth-os-backup" || !parsed.state){
    throw new Error("Este arquivo não parece ser um backup gerado por esta ferramenta.");
  }
  const proceed = confirm(`Restaurar o backup de "${parsed.companyName||'empresa desconhecida'}" (exportado em ${parsed._exportedAt?new Date(parsed._exportedAt).toLocaleString('pt-BR'):'data desconhecida'})?\n\nIsso SUBSTITUI todos os dados da empresa atual (${state.meta.companyName}). Essa ação não pode ser desfeita.`);
  if(!proceed) return false;
  state = {...defaultState(), ...parsed.state};
  for(const key of Object.keys(STORAGE_KEYS)){
    await persist(key);
  }
  const w = workspaces.find(x=>x.id===activeWorkspaceId);
  if(w){ w.name = state.meta.companyName; await persistWorkspacesList(); }
  return true;
}

async function loadState(){
  for(const [k, baseKey] of Object.entries(STORAGE_KEYS)){
    const storageKey = storageKeyFor(baseKey);
    try{
      const res = await window.storage.get(storageKey, false);
      if(res && res.value !== undefined){
        const parsed = JSON.parse(res.value);
        if(k === "aiAnalysis"){
          state.aiAnalysis = parsed.text; state.aiAnalysisDate = parsed.date;
        } else if(k === "blueprint"){
          state.blueprint = parsed.text; state.blueprintDate = parsed.date;
        } else {
          state[k] = parsed;
        }
      }
    }catch(e){ /* key not found yet, keep default */ }
  }
}

let saveTimer = null;
async function persist(key){
  const baseKey = STORAGE_KEYS[key];
  if(!baseKey) return true;
  const storageKey = storageKeyFor(baseKey);
  try{
    let value = state[key];
    if(key === "aiAnalysis"){ value = {text: state.aiAnalysis, date: state.aiAnalysisDate}; }
    if(key === "blueprint"){ value = {text: state.blueprint, date: state.blueprintDate}; }
    const result = await window.storage.set(storageKey, JSON.stringify(value), false);
    if(!result) throw new Error("Armazenamento retornou vazio");
    flashSaved(true);
    return true;
  }catch(e){
    console.error("Storage error", e);
    flashSaved(false);
    return false;
  }
}
function flashSaved(success){
  const bar = document.getElementById("savebar");
  if(!bar) return;
  clearTimeout(saveTimer);
  if(success === false){
    bar.textContent = "⚠ Falha ao salvar — verifique sua conexão e tente novamente";

    saveTimer = setTimeout(()=>{ bar.classList.remove("show","error"); bar.textContent = "Salvo"; }, 7000);

    bar.classList.remove("error");
    bar.classList.add("show");

}

function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtNum(n){ if(n===undefined||n===null||isNaN(n)) return "—"; return Number(n).toLocaleString('en-US'); }
function fmtMoney(n){ if(n===undefined||n===null||isNaN(n)) return "—"; return "$"+Number(n).toLocaleString('en-US'); }

// Turns a "week starting on" date (YYYY-MM-DD, from a <input type=date>) into a friendly
// "03/08 – 09/08/2026" label, so the person picks a week off a calendar instead of typing it.
function formatWeekLabelFromDate(isoDateStr){
  if(!isoDateStr) return "";
  const start = new Date(isoDateStr + "T00:00:00");
  if(isNaN(start.getTime())) return "";
  const end = new Date(start); end.setDate(end.getDate()+6);
  const pad2 = n => String(n).padStart(2,"0");
  const fmt = d => pad2(d.getDate()) + "/" + pad2(d.getMonth()+1);
  return `${fmt(start)} – ${fmt(end)}/${end.getFullYear()}`;
}

/* ============================= DAILY LOG (auto-builds the week) ============================= */

const DAILY_LOG_FIELDS = [
  {key:"leads", label:"Leads"}, {key:"qualifiedLeads", label:"Qualified Leads"},
  {key:"appointments", label:"Appointments"}, {key:"applications", label:"Applications"},
  {key:"preApprovals", label:"Pre Approvals"}, {key:"clearToClose", label:"Clear To Close"},
  {key:"loans", label:"Loans"}, {key:"revenue", label:"Revenue", prefix:"$"},
  {key:"marketingSpend", label:"Marketing Spend", prefix:"$"}, {key:"responseTime", label:"Response Time (min)"},
];

// Every week (whatever day it starts on) is bucketed to its Monday, so daily logs group consistently.
function getMondayOf(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function dailyLogsForWeek(mondayDate){
  const start = new Date(mondayDate + "T00:00:00");
  const end = new Date(start); end.setDate(end.getDate()+6);
  return state.dailyLogs.filter(l=>{
    const d = new Date(l.date + "T00:00:00");
    return d >= start && d <= end;
  }).sort((a,b)=> a.date < b.date ? -1 : 1);
}

// Sums the daily logs for a week into that week's entry in state.entries — this is what makes
// "log today's numbers" automatically build the weekly total, without touching manual entries.
function recomputeWeekFromDailyLogs(mondayDate){
  const logs = dailyLogsForWeek(mondayDate);
  const sumKeys = ["leads","qualifiedLeads","appointments","applications","preApprovals","clearToClose","loans","revenue","marketingSpend"];
  const sums = {};
  sumKeys.forEach(k=>{ sums[k] = logs.reduce((a,l)=> a + (l[k]||0), 0); });
  const rtVals = logs.map(l=>l.responseTime).filter(v=>v!==null&&v!==undefined);
  const avgResponseTime = rtVals.length ? Math.round(rtVals.reduce((a,b)=>a+b,0)/rtVals.length) : null;
  const cac = sums.loans>0 ? Math.round(sums.marketingSpend/sums.loans) : null;
  const weekLabel = formatWeekLabelFromDate(mondayDate);

  const existingIdx = state.entries.findIndex(e=>e.weekStartDate===mondayDate);
  const base = existingIdx!==-1 ? {...state.entries[existingIdx]} : {id:uid(), loanOfficers:null, realtorPartners:null};
  Object.assign(base, sums);
  base.responseTime = avgResponseTime;
  base.cac = cac;
  base.weekLabel = weekLabel;
  base.weekStartDate = mondayDate;
  base.fromDailyLog = true;

  if(existingIdx !== -1) state.entries[existingIdx] = base;
  else state.entries.push(base);
  persist('entries');
}

function pct(n){ if(n===undefined||n===null||isNaN(n)) return "—"; return Math.round(n)+"%"; }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================= CALCULATIONS ============================= */

function latestEntry(){
  return state.entries.length ? state.entries[state.entries.length-1] : null;
}
function previousEntry(){
  return state.entries.length > 1 ? state.entries[state.entries.length-2] : null;
}

// Reverse-engineer required volumes at each stage to hit target loans, using current rates
function reverseTargets(targetLoans, rates){
  const r = rates;
  const ctc = targetLoans / (r.ctcToLoan/100);
  const preApproval = ctc / (r.preApprovalToCTC/100);
  const application = preApproval / (r.appToPreApproval/100);
  const appointment = application / (r.apptToApp/100);
  const qualified = appointment / (r.qualifiedToAppt/100);
  const leads = qualified / (r.leadToQualified/100);
  return {
    loans: targetLoans, clearToClose: ctc, preApprovals: preApproval,
    applications: application, appointments: appointment,
    qualifiedLeads: qualified, leads: leads
  };
}

function weeklyOf(monthlyTargets){
  const w = {};
  for(const k in monthlyTargets) w[k] = monthlyTargets[k] / 4.33;
  return w;
}

const WORKING_DAYS_PER_MONTH = 21.7; // ~5 business days/week average across a month

function dailyOf(monthlyTargets){
  const d = {};
  for(const k in monthlyTargets) d[k] = monthlyTargets[k] / WORKING_DAYS_PER_MONTH;
  return d;
}

function annualOf(monthlyTargets){
  const a = {};
  for(const k in monthlyTargets) a[k] = monthlyTargets[k] * 12;
  return a;
}

// Health status green/yellow/red comparing actual to target ratio
function health(actual, target){
  if(target === undefined || target === null || target === 0 || actual === undefined || actual === null) return "yellow";
  const ratio = actual/target;
  if(ratio >= 0.9) return "green";
  if(ratio >= 0.7) return "yellow";
  return "red";
}
function healthLabel(h){ return h==="green"?"No ritmo":h==="yellow"?"Atenção":"Crítico"; }

function actualConversionRates(entry){
  if(!entry) return null;
  const out = {};
  out.leadToQualified = entry.leads ? (entry.qualifiedLeads/entry.leads*100) : null;
  out.qualifiedToAppt = entry.qualifiedLeads ? (entry.appointments/entry.qualifiedLeads*100) : null;
  out.apptToApp = entry.appointments ? (entry.applications/entry.appointments*100) : null;
  out.appToPreApproval = entry.applications ? (entry.preApprovals/entry.applications*100) : null;
  out.preApprovalToCTC = entry.preApprovals ? (entry.clearToClose/entry.preApprovals*100) : null;
  out.ctcToLoan = entry.clearToClose ? (entry.loans/entry.clearToClose*100) : null;
  return out;
}

// Find the weakest stage: biggest negative gap between actual conversion and configured/benchmark rate
function findBottleneck(entry, rates){
  const actual = actualConversionRates(entry);
  if(!actual) return null;
  let worst = null;
  STAGES.forEach(s=>{
    if(!s.rateKey) return;
    const a = actual[s.rateKey];
    const target = rates[s.rateKey];
    if(a === null || a === undefined) return;
    const gap = target - a; // positive means underperforming
    if(worst === null || gap > worst.gap){
      worst = {stage:s, actual:a, target, gap};
    }
  });
  return worst;
}

// Aggregates the FULL history (not just the latest week) into averages and trend direction per KPI,
// so AI modules can reason about years of data instead of a single snapshot.
function historicalStats(){
  const entries = state.entries;
  if(!entries.length) return null;
  const n = entries.length;
  const fields = [...STAGES, ...EXTRA_KPI_FIELDS].map(f=>f.key);

  function avgOfSet(set, key){
    const vals = set.map(e=>e[key]).filter(v=>v!==null&&v!==undefined&&!isNaN(v));
    if(!vals.length) return null;
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  }

  const half = Math.max(1, Math.floor(n/2));
  const firstHalf = entries.slice(0, half);
  const secondHalf = entries.slice(half);

  const avg = {}, trendPct = {};
  fields.forEach(key=>{
    avg[key] = avgOfSet(entries, key);
    const a = avgOfSet(firstHalf, key);
    const b = avgOfSet(secondHalf, key);
    trendPct[key] = (a===null || b===null || a===0) ? null : ((b-a)/a)*100;
  });

  const loansVals = entries.map(e=>e.loans).filter(v=>v!==null&&v!==undefined);
  return {
    weeks: n,
    avg, trendPct,
    bestLoans: loansVals.length ? Math.max(...loansVals) : null,
    worstLoans: loansVals.length ? Math.min(...loansVals) : null,
  };
}

/* ============================= STATISTICAL ANALYSIS ENGINE ============================= */
// This is what makes the tool behave like a senior data analyst instead of a rule-of-thumb
// dashboard: real correlation across the full history (which levers actually move loans),
// and linear regression to forecast where the business is headed if nothing changes.

const DRIVER_FIELDS = [
  {key:"leads", label:"Leads"},
  {key:"qualifiedLeads", label:"Qualified Leads"},
  {key:"appointments", label:"Appointments"},
  {key:"applications", label:"Applications"},
  {key:"preApprovals", label:"Pre Approvals"},
  {key:"clearToClose", label:"Clear To Close"},
  {key:"marketingSpend", label:"Marketing Spend"},
  {key:"cac", label:"CAC"},
  {key:"responseTime", label:"Response Time"},
  {key:"loanOfficers", label:"Loan Officers"},
  {key:"realtorPartners", label:"Realtor Partners"},
];

function pearson(xs, ys){
  const pairs = xs.map((x,i)=>[x, ys[i]]).filter(([x,y])=> x!==null&&x!==undefined&&y!==null&&y!==undefined&&!isNaN(x)&&!isNaN(y));
  const n = pairs.length;
  if(n < 5) return null;
  const xc = pairs.map(p=>p[0]), yc = pairs.map(p=>p[1]);
  const meanX = xc.reduce((a,b)=>a+b,0)/n;
  const meanY = yc.reduce((a,b)=>a+b,0)/n;
  let num=0, denX=0, denY=0;
  for(let i=0;i<n;i++){
    const dx = xc[i]-meanX, dy = yc[i]-meanY;
    num += dx*dy; denX += dx*dx; denY += dy*dy;
  }
  if(denX===0 || denY===0) return null;
  return {r: num/Math.sqrt(denX*denY), n};
}

function corrStrength(r){
  const a = Math.abs(r);
  if(a >= 0.7) return "forte";
  if(a >= 0.4) return "moderada";
  if(a >= 0.2) return "fraca";
  return "desprezível";
}

// Ranks every KPI by how strongly it historically correlates with Loans closed —
// this answers "what actually moves the outcome", not just "what has the worst conversion gap".
function driverAnalysis(){
  const entries = state.entries;
  if(entries.length < 5) return null;
  const loansArr = entries.map(e=>e.loans);
  const results = DRIVER_FIELDS.map(f=>{
    const arr = entries.map(e=>e[f.key]);
    const c = pearson(arr, loansArr);
    return c ? {key:f.key, label:f.label, r:c.r, n:c.n} : null;
  }).filter(Boolean);
  results.sort((a,b)=> Math.abs(b.r) - Math.abs(a.r));
  return results;
}

// Simple linear regression of a metric against week index (0,1,2...), used to forecast trend.
function linearTrend(entries, key){
  const vals = entries.map((e,i)=>({x:i, y:e[key]})).filter(p=> p.y!==null && p.y!==undefined && !isNaN(p.y));
  const n = vals.length;
  if(n < 5) return null;
  const meanX = vals.reduce((a,p)=>a+p.x,0)/n;
  const meanY = vals.reduce((a,p)=>a+p.y,0)/n;
  let num=0, den=0;
  vals.forEach(p=>{ num += (p.x-meanX)*(p.y-meanY); den += (p.x-meanX)*(p.x-meanX); });
  const slope = den===0 ? 0 : num/den;
  const intercept = meanY - slope*meanX;
  const lastX = vals[vals.length-1].x;
  return {slope, intercept, n, nextValue: slope*(lastX+1)+intercept, lastX};
}

// Full forecast for Loans: current pace, projected monthly pace if trend holds, and how many
// weeks (at current slope) it would take to close the gap to the monthly target.
function loansForecast(){
  const entries = state.entries;
  const trend = linearTrend(entries, "loans");
  if(!trend) return null;
  const weeklyTargetNow = state.meta.targetLoans / 4.33;
  const projectedNextWeek = Math.max(0, trend.nextValue);
  const projectedMonthlyPace = projectedNextWeek * 4.33;
  let weeksToTarget = null;
  if(trend.slope > 0.0001){
    weeksToTarget = Math.max(0, Math.ceil((weeklyTargetNow - projectedNextWeek) / trend.slope));
  }
  return {
    slopePerWeek: trend.slope,
    projectedNextWeek, projectedMonthlyPace,
    weeklyTargetNow, weeksToTarget,
    direction: trend.slope > 0.05 ? "subindo" : trend.slope < -0.05 ? "caindo" : "estável",
  };
}

  const e = latestEntry();
  const prev = previousEntry();
  const rates = state.rates;
  const targets = reverseTargets(state.meta.targetLoans, rates);
  const weekly = weeklyOf(targets);
  let ctx = `Empresa: ${state.meta.companyName}\nMeta mensal de loans: ${state.meta.targetLoans}\n\n`;
  if(e){
    ctx += "DADOS DA SEMANA MAIS RECENTE (" + (e.weekLabel||"sem rótulo") + "):\n";
    STAGES.forEach(s=>{ ctx += `- ${s.label}: ${e[s.key]??"—"}\n`; });
    EXTRA_KPI_FIELDS.forEach(f=>{ ctx += `- ${f.label}: ${e[f.key]??"—"}\n`; });
    const comp = weekCompleteness(e);
    if(!comp.isComplete){
      ctx += `\nATENÇÃO — QUALIDADE DE DADOS: esta semana está incompleta. Faltam ${comp.missing.length} campo(s): ${comp.missing.map(f=>f.label).join(", ")}. Mencione essa limitação na análise em vez de tratar os cálculos que dependem desses campos como confiáveis.\n`;
    }
    ctx += "\nTAXAS DE CONVERSÃO REAIS DESTA SEMANA (%):\n";
    const ac = actualConversionRates(e);

    ctx += "\nTAXAS DE CONVERSÃO ALVO CONFIGURADAS (%):\n";
    STAGES.forEach(s=>{ if(s.rateKey) ctx += `- ${s.rateLabel}: ${rates[s.rateKey]}%\n`; });
    ctx += "\nMETAS SEMANAIS (engenharia reversa para bater a meta mensal):\n";
    STAGES.forEach(s=>{ ctx += `- ${s.label}: ${Math.round(weekly[s.key]||0)}\n`; });
  } else {
    ctx += "Nenhum dado semanal foi preenchido ainda.\n";
  }
  if(prev){
    ctx += "\nSEMANA ANTERIOR (" + (prev.weekLabel||"sem rótulo") + ") para comparação:\n";
    STAGES.forEach(s=>{ ctx += `- ${s.label}: ${prev[s.key]??"—"}\n`; });
  }
  const hist = historicalStats();
  if(hist && hist.weeks > 2){
    ctx += `\nHISTÓRICO COMPLETO (${hist.weeks} semanas registradas no sistema — use isso para enxergar tendência, sazonalidade e desempenho ao longo do tempo, não só a semana atual):\n`;
    STAGES.forEach(s=>{
      const avg = hist.avg[s.key], trend = hist.trendPct[s.key];
      ctx += `- ${s.label}: média histórica ${avg!==null?Math.round(avg):"—"} | tendência (1ª metade do histórico vs 2ª metade): ${trend!==null?(trend>=0?"+":"")+trend.toFixed(1)+"%":"—"}\n`;
    });
    ctx += `- Melhor semana em loans (5 anos de histórico): ${hist.bestLoans??"—"} | Pior semana em loans: ${hist.worstLoans??"—"}\n`;
  }
  const drivers = driverAnalysis();
  if(drivers && drivers.length){
    ctx += `\nANÁLISE DE CORRELAÇÃO (quais KPIs mais se movem junto com Loans fechados, calculado sobre todo o histórico, n=${drivers[0].n} semanas — correlação NÃO implica causalidade, mas indica onde investigar primeiro):\n`;
    drivers.slice(0,6).forEach(d=>{
      ctx += `- ${d.label}: r=${d.r.toFixed(2)} (${corrStrength(d.r)}, ${d.r>=0?'correlação positiva':'correlação negativa'})\n`;
    });
  }
  const forecast = loansForecast();
  if(forecast){
    ctx += `\nPROJEÇÃO ESTATÍSTICA (regressão linear sobre Loans ao longo do tempo):\n`;
    ctx += `- Tendência: ${forecast.direction} a uma taxa de ${forecast.slopePerWeek.toFixed(2)} loans/semana\n`;
    ctx += `- Projeção para a próxima semana: ${forecast.projectedNextWeek.toFixed(1)} loans (ritmo mensal projetado: ${Math.round(forecast.projectedMonthlyPace)})\n`;
    ctx += `- Meta semanal atual: ${forecast.weeklyTargetNow.toFixed(1)} loans\n`;
    ctx += `- ${forecast.weeksToTarget!==null ? `No ritmo de melhora atual, faltam aproximadamente ${forecast.weeksToTarget} semanas para atingir a meta semanal` : `No ritmo atual, a tendência NÃO está convergindo para a meta — a empresa está estagnada ou piorando`}\n`;
  }
  if(state.loanOfficersList.length){

    ctx += `\nTOP LOAN OFFICERS (por loans fechados): ${sortedLO.slice(0,3).map(r=>`${r.name||'sem nome'} (${r.loansClosed??'—'} loans)`).join("; ")}\n`;

    ctx += `TOP REALTOR PARTNERS (por loans fechados): ${sortedRP.slice(0,3).map(r=>`${r.name||'sem nome'} (${r.loansClosed??'—'} loans)`).join("; ")}\n`;
  }

  }
  if(state.risks.length){
    const sortedRisks = state.risks.slice().sort((a,b)=>{
      const sa=(RISK_SCORE[a.probability]||0)*(RISK_SCORE[a.impact]||0), sb=(RISK_SCORE[b.probability]||0)*(RISK_SCORE[b.impact]||0);
      return sb-sa;
    });
    ctx += `TOP RISCOS REGISTRADOS: ${sortedRisks.slice(0,3).map(r=>r.title||'sem título').join("; ")}\n`;
  }
  return ctx;
}

// Extends buildDataContext() with everything specific to the 30/60/90 blueprint: cadence
// targets, individual performance rankings, channel ROI, risks, and the current action plan.
function buildBlueprintContext(){
  let ctx = buildDataContext();
  const targets = reverseTargets(state.meta.targetLoans, state.rates);
  const daily = dailyOf(targets), weekly = weeklyOf(targets), annual = annualOf(targets);

  ctx += `\nMETAS EM TODOS OS RITMOS (diário, semanal, mensal, anual) PARA BATER ${state.meta.targetLoans} LOANS/MÊS:\n`;
  STAGES.forEach(s=>{
    ctx += `- ${s.label}: ${Math.round(daily[s.key])}/dia | ${Math.round(weekly[s.key])}/semana | ${Math.round(targets[s.key])}/mês | ${Math.round(annual[s.key])}/ano\n`;
  });

  if(state.loanOfficersList.length){
    ctx += `\nRANKING DE LOAN OFFICERS:\n`;
    state.loanOfficersList.slice().sort((a,b)=>(b.loansClosed||0)-(a.loansClosed||0)).forEach(r=>{
      ctx += `- ${r.name||'sem nome'}: ${r.loansClosed??'—'} loans fechados, ${r.leadsAssigned??'—'} leads atribuídos${r.notes?`. Nota: ${r.notes}`:''}\n`;
    });
  }
  if(state.realtorPartnersList.length){
    ctx += `\nRANKING DE REALTOR PARTNERS:\n`;
    state.realtorPartnersList.slice().sort((a,b)=>(b.loansClosed||0)-(a.loansClosed||0)).forEach(r=>{
      ctx += `- ${r.name||'sem nome'}: ${r.loansClosed??'—'} loans fechados de ${r.referrals??'—'} indicações\n`;
    });
  }
  if(state.channels.length){
    ctx += `\nCANAIS DE AQUISIÇÃO:\n`;
    state.channels.forEach(c=>{
      const cac = (c.spend && c.loansClosed) ? (c.spend/c.loansClosed).toFixed(0) : "—";
      ctx += `- ${c.name||'sem nome'}: ${c.leads??'—'} leads, gasto $${c.spend??'—'}, ${c.loansClosed??'—'} loans, CAC $${cac}\n`;
    });
  }
  if(state.risks.length){
    ctx += `\nRISCOS REGISTRADOS (ordenados por criticidade):\n`;
    state.risks.slice().sort((a,b)=>{
      const sa=(RISK_SCORE[a.probability]||0)*(RISK_SCORE[a.impact]||0), sb=(RISK_SCORE[b.probability]||0)*(RISK_SCORE[b.impact]||0);
      return sb-sa;
    }).forEach(r=>{
      ctx += `- ${r.title||'sem título'} (probabilidade ${r.probability||'—'}, impacto ${r.impact||'—'}): mitigação: ${r.mitigation||'não definida'}\n`;
    });
  }
  if(state.actionPlan.length){
    ctx += `\nPLANO DE AÇÃO ATUAL:\n`;
    state.actionPlan.forEach((p,i)=>{ ctx += `${i+1}. ${p.title} (impacto: ${p.impact||'—'}, responsável: ${p.responsible||'—'}, prazo: ${p.deadline||'—'})\n`; });
  }
  return ctx;
}

async function withButtonLoading(btn, label, fn){
  if(!btn) return fn();
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = label;
  try{ await fn(); }
  catch(err){ alert("Não foi possível gerar agora: " + err.message); }
  finally{ if(btn.isConnected){ btn.disabled = false; btn.textContent = orig; } }
}

function trendChartSvg(entries, key, label){
  const vals = entries.map(e=> (e[key]===null||e[key]===undefined) ? null : Number(e[key]));
  const clean = vals.map(v=>v===null?0:v);
  const max = Math.max(...clean, 1);
  const w = 900, h = 130, pad = 10;
  const n = entries.length;
  const stepX = n > 1 ? (w - pad*2) / (n-1) : 0;
  const points = clean.map((v,i)=>{
    const x = pad + stepX*i;
    const y = h - pad - ((v/max) * (h - pad*2));
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const areaPoints = `${pad},${h-pad} ` + points + ` ${(pad+stepX*(n-1)).toFixed(1)},${h-pad}`;
  const firstLabel = entries[0] ? (entries[0].weekLabel||"") : "";
  const lastLabel = entries[n-1] ? (entries[n-1].weekLabel||"") : "";
  return `
  <svg viewBox="0 0 ${w} ${h+22}" style="width:100%;height:auto;display:block;">
    <polygon points="${areaPoints}" fill="rgba(11,30,59,0.08)" stroke="none"></polygon>
    <polyline points="${points}" fill="none" stroke="#0B1E3B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <text x="${pad}" y="${h+16}" font-size="11" fill="#64748B" font-family="Inter,sans-serif">${esc(firstLabel)}</text>
    <text x="${w-pad}" y="${h+16}" font-size="11" fill="#64748B" font-family="Inter,sans-serif" text-anchor="end">${esc(lastLabel)}</text>
  </svg>`;
}

// Checks a single week's entry for blank fields — this is what powers the "missing data" warnings.
function weekCompleteness(entry){
  if(!entry) return {missing: [], total: ALL_ENTRY_FIELDS.length, isComplete: true};
  const missing = ALL_ENTRY_FIELDS.filter(f => entry[f.key]===null || entry[f.key]===undefined);
  return {missing, total: ALL_ENTRY_FIELDS.length, isComplete: missing.length===0};
}

function missingDataBanner(entry){
  if(!entry){
    return `<div class="data-alert warn">
      <div><b>⚠ Nenhuma semana preenchida ainda.</b> O sistema não tem nenhum dado — funil, KPIs e IA ficam vazios até você salvar a primeira semana ou importar um CSV.</div>
    </div>`;
  }
  const c = weekCompleteness(entry);
  if(c.isComplete) return "";
  return `<div class="data-alert warn">
    <div><b>⚠ Dados incompletos na semana "${esc(entry.weekLabel||"sem rótulo")}".</b> Faltam ${c.missing.length} de ${c.total} campos: ${c.missing.map(f=>esc(f.label)).join(", ")}. Esses campos aparecem como "—" no funil e podem distorcer os cálculos de conversão, correlação e a análise da IA.</div>

}

function ruleBasedActionPlan(){
  const e = latestEntry();
  if(!e) return [];
  const actual = actualConversionRates(e);
  const gaps = STAGES.filter(s=>s.rateKey).map(s=>{
    const a = actual[s.rateKey];
    const target = state.rates[s.rateKey];
    const gap = (a===null||a===undefined) ? -999 : (target - a);
    return {stage:s, gap};
  }).sort((a,b)=>b.gap-a.gap);

  const out = [];
  gaps.forEach((g,i)=>{
    if(out.length>=10) return;
    const actions = STAGE_ACTIONS[g.stage.rateKey] || [];
    actions.forEach((a,j)=>{
      if(out.length>=10) return;
      out.push({
        id:uid(), title:a.title, impact:a.impact,
        responsible:"Equipe de Crescimento", deadline: j===0?"15 dias":"30 dias", status:"Não iniciado"
      });
    });
  });
  return out;
}

function parseJSONLoose(text){
  let t = text.trim();
  t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = t.indexOf('[') !== -1 && (t.indexOf('{') === -1 || t.indexOf('[') < t.indexOf('{')) ? t.indexOf('[') : t.indexOf('{');
  const end = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
  if(start !== -1 && end !== -1) t = t.slice(start, end+1);
  return JSON.parse(t);
}

function gapCell(r){
  if(r.meta===undefined||r.meta===null||r.meta===""||r.resultado===undefined||r.resultado===null||r.resultado==="") return `<span class="muted small">—</span>`;
  const gap = r.resultado - r.meta;
  const h = health(r.resultado, r.meta);
  return `<span class="badge ${h}"><span class="d"></span>${gap>=0?'+':''}${Math.round(gap)}</span>`;
}

function statisticalDiagnosticsCard(){

  if(entries.length < 5){
    return `<div class="card">

    </div>`;
  }

  const drivers = driverAnalysis();
  const forecast = loansForecast();

  const driverRows = (drivers||[]).slice(0,8).map(d=>{
    const strength = corrStrength(d.r);
    const badgeClass = strength==="forte" ? (d.r>=0?"green":"red") : strength==="moderada" ? "yellow" : "yellow";
    const barWidth = Math.min(100, Math.abs(d.r)*100);
    return `<tr>
      <td>${esc(d.label)}</td>
      <td style="width:200px;">
        <div style="background:#F0F2F5;border-radius:6px;height:10px;overflow:hidden;">
          <div style="width:${barWidth}%;height:100%;background:${d.r>=0?'var(--green)':'var(--red)'};"></div>
        </div>
      </td>
      <td class="mono" style="text-align:right;">${d.r>=0?'+':''}${d.r.toFixed(2)}</td>
      <td><span class="badge ${badgeClass}"><span class="d"></span>${strength}</span></td>
    </tr>`;
  }).join("");

  const forecastBlock = forecast ? `
    <div class="grid g3" style="margin-top:14px;">
      <div class="kpi-card">
        <div class="label">Tendência de Loans</div>
        <div class="value" style="font-size:17px;">${forecast.direction==='subindo'?'&#8599; Subindo':forecast.direction==='caindo'?'&#8600; Caindo':'&#8594; Estável'}</div>
        <div class="foot">${forecast.slopePerWeek>=0?'+':''}${forecast.slopePerWeek.toFixed(2)} loans/semana</div>
      </div>
      <div class="kpi-card">
        <div class="label">Projeção próxima semana</div>
        <div class="value">${forecast.projectedNextWeek.toFixed(1)}</div>

        <div class="value">${forecast.weeksToTarget!==null ? (forecast.weeksToTarget > 104 ? '>104' : forecast.weeksToTarget) : '—'}</div>
        <div class="foot">${forecast.weeksToTarget===null ? 'tendência não converge — ação necessária' : forecast.weeksToTarget > 104 ? `no ritmo atual, mais de 2 anos (${forecast.weeksToTarget} semanas) — ritmo insuficiente, não espere a tendência sozinha` : 'no ritmo de melhora atual'}</div>
      </div>
    </div>
  ` : "";

  return `
  <div class="card">
    <div class="section-title">Diagnóstico estatístico</div>
    <div class="section-help">Correlação de cada KPI com Loans fechados, calculada sobre as ${entries.length} semanas do histórico completo — isto é o que realmente move o resultado, não achismo. Correlação não é causalidade: use como ponto de partida para investigar, não como conclusão definitiva.</div>

    ${driverRows ? `<div style="overflow-x:auto;"><table style="min-width:520px;"><thead><tr><th>KPI</th><th>Correlação com Loans</th><th style="text-align:right;">r</th><th>Força</th></tr></thead><tbody>${driverRows}</tbody></table></div>` : `<div class="empty">Dados insuficientes para calcular correlações.</div>`}
    ${forecastBlock}
  </div>`;
}

  switch(id){

  "weekly-coach": "O resumo executivo está pronto para compartilhar com stakeholders.",
  "meetings": "Suas decisões estão documentadas — agora registre o que está sendo testado.",
  "experiments": "Todo aprendizado validado aqui deveria virar processo na biblioteca.",
  "sop": "Seus processos estão documentados e já aparecem na Knowledge Base.",

  "loan-officers": "Você já sabe quem performa melhor e por quê — use isso para replicar o que funciona.",

};

function guidedBannerHtml(current){
  const idx = PLAYBOOK_ORDER.indexOf(current);
  const completedCount = PLAYBOOK_ORDER.filter(isComplete).length;
  const dots = PLAYBOOK_ORDER.map((id,i)=>{
    const done = isComplete(id);
    const cur = id===current;
    const cls = cur ? "cur" : (done ? "done" : "todo");
    const inner = done ? "&#10003;" : (i+1);
    return `<div class="gstep ${cls}" data-goto="${id}" title="${esc(stepLabel(id))} — ${esc(COMPLETION_CRITERIA[id]||'')}">${inner}</div>`;
  }).join(`<div class="gline"></div>`);
  return `<div class="guide-bar">
    <div class="guide-bar-top">
      <span>Sequência guiada — Etapa ${idx+1} de ${PLAYBOOK_ORDER.length}: ${esc(stepLabel(current))}</span>
      <span class="muted" style="font-weight:500;">${completedCount}/${PLAYBOOK_ORDER.length} concluídas</span>
    </div>
    <div class="guide-dots">${dots}</div>
  </div>`;
}

function nextStepCalloutHtml(current){
  const idx = PLAYBOOK_ORDER.indexOf(current);
  const done = isComplete(current);
  const nextId = PLAYBOOK_ORDER[idx+1];
  if(done && nextId){
    return `<div class="next-callout done">
      <div>&#9989; <b>Etapa ${idx+1} concluída.</b> ${COMPLETION_NOTES[current]||""}</div>
      <button class="btn" data-goto-step="${nextId}">Ir para Etapa ${stepNumber(nextId)}: ${esc(stepLabel(nextId))} &rarr;</button>
    </div>`;
  }
  if(done && !nextId){
    return `<div class="next-callout done"><div>&#127881; <b>Etapa ${idx+1} concluída — são as 10 etapas!</b> ${COMPLETION_NOTES[current]||""}</div></div>`;
  }
  return `<div class="next-callout pending">
    <div><b>Etapa ${idx+1} ainda não concluída.</b> ${PENDING_NOTES[current]||""}</div>
  </div>`;
}

</script>
